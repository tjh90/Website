version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: "docker-compose"
    directory: "/build"
    schedule:
      interval: "weekly"
    groups:
      docker-compose:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
